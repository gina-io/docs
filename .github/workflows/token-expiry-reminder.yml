name: Token expiry reminder

# The earliest expiry date of the deploy credentials lives in the
# DEPLOY_TOKEN_EXPIRY repository secret (YYYY-MM-DD), so it appears neither in
# this file nor in a run log (secrets print as ***). The reminder issue names
# no credential and no date.

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check token expiry
        env:
          EXPIRY: ${{ secrets.DEPLOY_TOKEN_EXPIRY }}
        run: |
          # GNU date reads an empty string as today, so an unset secret would
          # open a reminder every week: fail the run instead.
          if ! [[ "$EXPIRY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::The DEPLOY_TOKEN_EXPIRY secret is unset or is not a YYYY-MM-DD date."
            exit 1
          fi
          EXPIRY_S=$(date -d "$EXPIRY" +%s)
          TODAY_S=$(date -d "$(date +%Y-%m-%d)" +%s)
          DAYS=$(( (EXPIRY_S - TODAY_S) / 86400 ))
          if [ "$DAYS" -le 14 ]; then
            echo "TOKEN_EXPIRING=true" >> "$GITHUB_ENV"
          fi

      - name: Open reminder issue
        if: env.TOKEN_EXPIRING == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Action required: deploy credential rotation due`,
              body: [
                `One or more deploy credentials expire within 14 days.`,
                ``,
                `After rotating them:`,
                `1. Update the secrets at https://github.com/gina-io/docs/settings/secrets/actions`,
                `2. Set the \`DEPLOY_TOKEN_EXPIRY\` secret to the earliest new expiry date (YYYY-MM-DD).`,
                ``,
                `Close this issue without naming a credential or a date.`,
              ].join('\n'),
              labels: ['maintenance']
            })
