name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare/**'
  # The docs merge job in update-alias.yml pushes main with GITHUB_TOKEN, which
  # fires no push trigger — it dispatches this workflow instead when the merge
  # touched infra/cloudflare/**.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy Worker
        # Wrangler v4 (unpinned) — infra/cloudflare config validated v4-compatible.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare
